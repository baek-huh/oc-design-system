<!-- @dsCard group="Colors" viewport="700x220" name="Semantic — Dark" subtitle="Same tokens under [data-theme="dark"] / .dark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text);background:#fff}.row{display:flex;gap:6px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:8px}.lab{font-size:11px;margin-top:6px;color:var(--text-secondary)}.hex{font-size:10px;color:var(--text-sub);font-family:var(--font-mono)}</style></head><body><div class="dark" style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:12px;border-radius:12px;background:var(--surface)"><div><div style="height:40px;border-radius:8px;background:var(--text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--text</div></div><div><div style="height:40px;border-radius:8px;background:var(--text-secondary);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--text-secondary</div></div><div><div style="height:40px;border-radius:8px;background:var(--text-sub);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--text-sub</div></div><div><div style="height:40px;border-radius:8px;background:var(--text-disabled);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--text-disabled</div></div><div><div style="height:40px;border-radius:8px;background:var(--text-on);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--text-on</div></div><div><div style="height:40px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--surface</div></div><div><div style="height:40px;border-radius:8px;background:var(--surface-sub);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--surface-sub</div></div><div><div style="height:40px;border-radius:8px;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--bg</div></div><div><div style="height:40px;border-radius:8px;background:var(--border);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--border</div></div><div><div style="height:40px;border-radius:8px;background:var(--border-sub);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--border-sub</div></div><div><div style="height:40px;border-radius:8px;background:var(--divide);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--divide</div></div><div><div style="height:40px;border-radius:8px;background:var(--status-negative);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--status-negative</div></div><div><div style="height:40px;border-radius:8px;background:var(--surface-highlight-secondary);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--surface-highlight-secondary</div></div><div><div style="height:40px;border-radius:8px;background:var(--surface-success-primary);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--surface-success-primary</div></div><div><div style="height:40px;border-radius:8px;background:var(--icon-disabled);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--icon-disabled</div></div><div><div style="height:40px;border-radius:8px;background:var(--label-normal);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)"></div><div class="hex" style="margin-top:4px;color:var(--text-secondary)">--label-normal</div></div></div></body></html>
