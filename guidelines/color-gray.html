<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text);background:#fff}.row{display:flex;gap:6px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:8px}.lab{font-size:11px;margin-top:6px;color:var(--text-secondary)}.hex{font-size:10px;color:var(--text-sub);font-family:var(--font-mono)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--gray-25);box-shadow:inset 0 0 0 1px var(--slate-100)"></div><div class="lab">25</div><div class="hex">250,250,250</div></div><div class="sw"><div class="chip" style="background:var(--gray-50);box-shadow:inset 0 0 0 1px var(--slate-100)"></div><div class="lab">50</div><div class="hex">242,242,242</div></div><div class="sw"><div class="chip" style="background:var(--gray-100);"></div><div class="lab">100</div><div class="hex">229,229,229</div></div><div class="sw"><div class="chip" style="background:var(--gray-200);"></div><div class="lab">200</div><div class="hex">204,204,204</div></div><div class="sw"><div class="chip" style="background:var(--gray-300);"></div><div class="lab">300</div><div class="hex">178,178,178</div></div><div class="sw"><div class="chip" style="background:var(--gray-400);"></div><div class="lab">400</div><div class="hex">153,153,153</div></div><div class="sw"><div class="chip" style="background:var(--gray-500);"></div><div class="lab">500</div><div class="hex">128,128,128</div></div><div class="sw"><div class="chip" style="background:var(--gray-600);"></div><div class="lab">600</div><div class="hex">102,102,102</div></div><div class="sw"><div class="chip" style="background:var(--gray-700);"></div><div class="lab">700</div><div class="hex">77,77,77</div></div><div class="sw"><div class="chip" style="background:var(--gray-800);"></div><div class="lab">800</div><div class="hex">51,51,51</div></div><div class="sw"><div class="chip" style="background:var(--gray-900);"></div><div class="lab">900</div><div class="hex">26,26,26</div></div></div></body></html>
